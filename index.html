<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<meta name="application-name" content="PW STOCK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PW STOCK">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>PW STOCK</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#splash{position:fixed;inset:0;background:linear-gradient(145deg,#ff6a00,#ff922d);display:flex;align-items:center;justify-content:center;z-index:10;transition:.25s}
.card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;width:min(310px,84vw);box-shadow:0 18px 50px #0003}
.logo{width:90px;height:90px;object-fit:contain}
.title{font-size:28px;font-weight:900;color:#ff6a00;margin-top:8px}
.sub{font-size:13px;color:#666;margin-top:5px}
.spin{width:28px;height:28px;border:3px solid #ffd8bd;border-top-color:#ff6a00;border-radius:50%;animation:spin .8s linear infinite;margin:18px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
#help{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:none}
#help a{display:block;background:#111;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:12px;font-weight:800}
</style>
</head>
<body>
<div id="splash">
  <div class="card">
    <img class="logo" src="./icon-192.png" alt="POTATOWALA">
    <div class="title">PW STOCK</div>
    <div class="sub">Loading stock order app...</div>
    <div class="spin"></div>
  </div>
</div>

<iframe id="app" src="https://script.google.com/macros/s/AKfycbxunKvpErIRJmvlZmdzd0OvipNcGxZOSZCP6L06UJPb1IU6r4tNWWdAUNbdlFgiVo/exec"></iframe>

<div id="help">
  <a href="https://script.google.com/macros/s/AKfycbxunKvpErIRJmvlZmdzd0OvipNcGxZOSZCP6L06UJPb1IU6r4tNWWdAUNbdlFgiVo/exec" target="_blank" rel="noopener">OPEN PW STOCK DIRECTLY</a>
</div>

<script>
const splash=document.getElementById("splash");
const app=document.getElementById("app");
const help=document.getElementById("help");

app.addEventListener("load",function(){
  setTimeout(function(){
    splash.style.opacity="0";
    setTimeout(function(){splash.style.display="none"},260);
  },500);
});

setTimeout(function(){
  if(splash.style.display!=="none") help.style.display="block";
},8000);

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}
</script>
</body>
</html>
