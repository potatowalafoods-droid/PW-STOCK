<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#ff6a00">

<meta name="application-name" content="PW STOCK">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PW STOCK">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icon-192.png">

<link rel="apple-touch-icon"
      href="./icon-192.png">

<title>PW STOCK</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#fff7f0;
  color:#171717;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  padding-top:
  calc(24px + env(safe-area-inset-top));

  padding-bottom:
  calc(24px + env(safe-area-inset-bottom));
}

.card{

  width:min(420px,100%);

  background:#ffffff;

  border-radius:28px;

  padding:30px 24px;

  text-align:center;

  box-shadow:
  0 18px 55px rgba(0,0,0,.16);

  border:
  1px solid #ffe0cc;
}

.logo{

  width:112px;
  height:112px;

  object-fit:contain;
}

h1{

  margin:10px 0 5px;

  color:#ff6a00;

  font-size:34px;
}

.sub{

  color:#666;

  font-size:14px;

  line-height:1.5;

  margin-bottom:24px;
}

.openBtn{

  display:block;

  width:100%;

  border:0;

  border-radius:14px;

  background:#ff6a00;

  color:#ffffff;

  font-size:17px;

  font-weight:900;

  padding:15px 18px;

  cursor:pointer;

  text-decoration:none;

  box-shadow:
  0 8px 20px rgba(255,106,0,.25);
}

.openBtn:active{

  transform:scale(.98);
}

.note{

  font-size:11px;

  color:#888;

  line-height:1.5;

  margin-top:14px;
}

.install{

  margin-top:18px;

  padding-top:16px;

  border-top:1px solid #eeeeee;

  font-size:12px;

  color:#555;

  line-height:1.6;
}

.version{

  font-size:10px;

  color:#aaaaaa;

  margin-top:12px;
}

</style>

</head>

<body>

<div class="card">

  <img
    class="logo"
    src="./icon-192.png"
    alt="POTATOWALA">

  <h1>PW STOCK</h1>

  <div class="sub">
    POTATOWALA Stock Order • Inventory • Purchase Control
  </div>


  <!-- CORRECT PW STOCK APPS SCRIPT LINK -->

  <a
    class="openBtn"
    href="https://script.google.com/macros/s/AKfycbxunKypFrlRJmvlZmdzd0QvipNcGxZOSZCP6I_06UJIPb1IU6r4tNWWdAUNbdLFqjVo/exec">

    OPEN PW STOCK

  </a>


  <div class="note">

    Latest PW STOCK data and functions
    open from Google Apps Script.

  </div>


  <div class="install">

    Install this page to your phone Home Screen.<br><br>

    PW STOCK will appear with the
    POTATOWALA app icon.

  </div>


  <div class="version">

    PW STOCK • GitHub Launcher v3

  </div>

</div>


<script>

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
      .register("./service-worker.js")
      .catch(function(error){
        console.log(
          "Service Worker Error:",
          error
        );
      });

    }
  );

}

</script>

</body>

</html>
