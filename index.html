<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<meta name="application-name" content="PW STOCK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PW STOCK">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PW STOCK</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
#splash{position:fixed;inset:0;background:linear-gradient(145deg,#ff6a00,#ff922d);display:flex;align-items:center;justify-content:center;z-index:10;transition:opacity .25s ease}
.card{background:#fff;border-radius:26px;padding:28px 24px;text-align:center;width:min(310px,84vw);box-shadow:0 18px 50px #0003}
.logo{width:92px;height:92px;object-fit:contain}
.title{font-size:29px;font-weight:900;color:#ff6a00;margin-top:8px}
.sub{font-size:13px;color:#666;margin-top:5px}
.spin{width:28px;height:28px;border:3px solid #ffd8bd;border-top-color:#ff6a00;border-radius:50%;animation:spin .8s linear infinite;margin:18px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#fallback{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:none}
#fallback a{display:block;background:#111;color:#fff;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:800}
</style>
</head>
<body>
<div id="splash">
  <div class="card">
    <img class="logo" src="icon-192.png" alt="POTATOWALA">
    <div class="title">PW STOCK</div>
    <div class="sub">POTATOWALA Stock Order</div>
    <div class="spin"></div>
  </div>
</div>

<iframe id="app" src="https://script.google.com/macros/s/AKfycbxunKvpErIRJmvlZmdzd0OvipNcGxZOSZCP6L06UJPb1IU6r4tNWWdAUNbdlFgiVo/exec" allow="clipboard-read; clipboard-write"></iframe>

<div id="fallback">
  <a href="https://script.google.com/macros/s/AKfycbxunKvpErIRJmvlZmdzd0OvipNcGxZOSZCP6L06UJPb1IU6r4tNWWdAUNbdlFgiVo/exec" target="_blank" rel="noopener">OPEN PW STOCK</a>
</div>

<script>
const splash=document.getElementById("splash");
const frame=document.getElementById("app");
const fallback=document.getElementById("fallback");

frame.addEventListener("load",()=>{
  setTimeout(()=>{splash.style.opacity="0";setTimeout(()=>splash.style.display="none",260)},350);
});

setTimeout(()=>{
  if(splash.style.display!=="none") fallback.style.display="block";
},9000);

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
